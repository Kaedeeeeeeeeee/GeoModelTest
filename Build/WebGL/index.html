<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
    <title>ジオクエスト</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <section id="unity-loading-bar" aria-labelledby="loading-title" aria-busy="true">
        <p class="loading-eyebrow">G-LAB / ジオクエスト</p>
        <h1 id="loading-title">ゲームを読み込んでいます</h1>
        <p id="loading-status" role="status" aria-live="polite">読み込みの準備をしています…</p>
        <div id="unity-progress-bar-empty" role="progressbar" aria-label="ゲームの読み込み" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="unity-progress-bar-full"></div>
        </div>
        <p id="loading-progress-text">0%</p>
        <p id="loading-help">初回はダウンロードに時間がかかることがあります。<br>この画面を開いたままお待ちください。</p>
        <button id="loading-retry" type="button" onclick="location.reload()" hidden>もう一度読み込む</button>
        <p id="loading-version"></p>
      </section>
      <div id="unity-warning"></div>
    </div>
    <div id="orientation-overlay" lang="ja" aria-hidden="true">
      <div class="orientation-card">
        <div class="orientation-icon">↻</div>
        <div class="orientation-title">横向きで遊んでください</div>
        <div class="orientation-body">スマートフォンを横向きにすると、<br>ゲームを続けられます。</div>
      </div>
    </div>
    <script src="TemplateData/performance.js"></script>
    <script src="TemplateData/loading.js" onerror="document.getElementById('loading-status').textContent='読み込めませんでした。接続を確認して、もう一度お試しください。'; document.getElementById('loading-retry').hidden=false;"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var orientationOverlay = document.querySelector("#orientation-overlay");

      function unityShowBanner(msg, type) {
        if (window.gameLoading && window.gameLoading.handleBanner(msg, type)) return;
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.textContent = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ZHANGSHIFENG",
        productName: "GeoModelTest",
        productVersion: "2026.09.11-first-controls.1",
        matchWebGLToCanvasSize: false,
        devicePixelRatio: 1,
        showBanner: unityShowBanner,
      };

      // Safe 720p fallback even if the optional performance bridge fails to load.
      canvas.width = 1280;
      canvas.height = 720;
      if (window.GeoModelPerformanceInstaller) GeoModelPerformanceInstaller.install(canvas, config);

      // CSS controls display size and letterboxing independently of render resolution.
      function isCoarsePointer() {
        return window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      }

      function isIPadLike() {
        return /iPad/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      }

      function updateOrientationOverlay() {
        var portrait = window.innerHeight > window.innerWidth;
        var shouldBlock = isCoarsePointer() && portrait;
        orientationOverlay.classList.toggle("is-visible", shouldBlock);
        orientationOverlay.setAttribute("aria-hidden", shouldBlock ? "false" : "true");
        canvas.style.pointerEvents = shouldBlock ? "none" : "auto";
      }

      ["resize", "orientationchange"].forEach((eventName) => {
        window.addEventListener(eventName, updateOrientationOverlay, { passive: true });
      });
      updateOrientationOverlay();

      canvas.addEventListener("pointerdown", () => {
        try {
          canvas.focus({ preventScroll: true });
        } catch (error) {
          canvas.focus();
        }
      });

      function preventBrowserGesture(event) {
        if (event.target instanceof Element && event.target.closest('#loading-retry')) return;
        event.preventDefault();
      }

      [
        "touchstart",
        "touchmove",
        "touchend",
        "touchcancel",
        "gesturestart",
        "gesturechange",
        "gestureend"
      ].forEach((eventName) => {
        document.addEventListener(eventName, preventBrowserGesture, { passive: false });
      });

      window.addEventListener("scroll", () => {
        window.scrollTo(0, 0);
      }, { passive: false });

      function exitIPadFullscreenIfNeeded() {
        if (!isIPadLike()) return;

        var fullscreenElement = document.fullscreenElement || document.webkitFullscreenElement;
        if (!fullscreenElement) return;

        try {
          var exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
          if (exitFullscreen) {
            var result = exitFullscreen.call(document);
            if (result && typeof result.catch === "function") {
              result.catch(function() {});
            }
          }
        } catch (error) {
          // Browser-reserved fullscreen gestures cannot always be controlled from the iframe.
        }
      }

      ["fullscreenchange", "webkitfullscreenchange"].forEach((eventName) => {
        document.addEventListener(eventName, exitIPadFullscreenIfNeeded);
      });
      setTimeout(exitIPadFullscreenIfNeeded, 250);
      setTimeout(exitIPadFullscreenIfNeeded, 1000);

      document.addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });

      if (window.GeoModelLoading) window.gameLoading = GeoModelLoading.start(canvas, config, loaderUrl);
    </script>
  </body>
</html>
