<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>プレビュー · 体験後アンケート</title>
  <link rel="stylesheet" href="survey.css">
  <link rel="stylesheet" href="preview.css">
  <script src="questions.js" defer></script>
  <script src="preview.js" defer></script>
</head>
<body>
  <header class="brand"><a href="#main">G-LAB <span>/ GEO MODEL</span></a><span>体験後アンケート</span></header>
  <main id="main">
    <aside class="preview-notice" aria-label="プレビューについて">
      <strong>プレビュー</strong>
      <p>ゲームをしなくても、全14問の内容と選択肢を確認できます。実際のアンケートと同じ設問です。<br>回答を試しても研究データとして送信・保存されません。再読み込みすると入力は消えます。</p>
      <span id="definition-version"></span>
    </aside>
    <div id="preview-form">
      <div class="introduction"><h1>体験をふりかえろう</h1><p id="intro"></p><p id="privacy" class="privacy"></p></div>
      <div class="progress"><div><span id="step-label"></span><span id="answered-label"></span></div><progress id="progress" max="5" value="1" aria-label="アンケートの進み具合"></progress></div>
      <form id="survey" novalidate>
        <div id="sections"></div>
        <p id="form-error" role="alert" tabindex="-1" hidden></p>
        <div class="actions"><button id="previous" type="button" class="secondary">戻る</button><button id="next" type="submit">次へ →</button></div>
        <p class="footnote">プレビュー専用です。「回答を送信する」を押しても、回答は送信されません。</p>
      </form>
    </div>
    <section id="preview-complete" class="message" tabindex="-1" hidden><span class="symbol">✓</span><h1>プレビューが完了しました</h1><p>回答は送信されていません。<br>実際の回答では、この段階で送信完了画面が表示されます。</p></section>
    <noscript>このプレビューの表示には JavaScript が必要です。</noscript>
  </main>
  <footer>Geo Model · 地学シリアスゲーム · プレビュー</footer>
</body>
</html>
