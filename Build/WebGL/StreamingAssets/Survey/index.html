<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://*.supabase.co http://127.0.0.1:55321; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>体験後アンケート · Geo Model</title>
  <link rel="stylesheet" href="survey.css">
  <script src="config.js" defer></script>
  <script src="questions.js" defer></script>
  <script src="survey.js" defer></script>
</head>
<body>
  <header class="brand"><a href="#" aria-label="Geo Model アンケートの先頭">G-LAB <span>/ GEO MODEL</span></a><span>体験後アンケート</span></header>
  <main id="main">
    <section id="loading" class="message" aria-live="polite"><span class="symbol">…</span><h1>アンケートを準備しています</h1><p>少しお待ちください。</p></section>
    <section id="access-error" class="message" hidden><span class="symbol">↗</span><h1>ゲームから開いてください</h1><p id="access-text">ゲームの調査報告にある「アンケートに答える」から進んでください。</p><button id="access-retry" type="button">もう一度確認する</button></section>
    <section id="complete" class="message" hidden><span class="symbol">✓</span><h1>回答を受け取りました</h1><p>教えてくれて、ありがとうございます。<br>これで体験はおしまいです。<br>このページを閉じてもだいじょうぶです。</p></section>
    <div id="questionnaire" hidden>
      <div class="introduction"><h1>体験をふりかえろう</h1><p id="intro"></p><p id="privacy" class="privacy"></p></div>
      <div class="progress"><div><span id="step-label"></span><span id="answered-label"></span></div><progress id="progress" max="5" value="1" aria-label="アンケートの進み具合"></progress></div>
      <form id="survey" novalidate>
        <div class="section-heading"><span id="section-number"></span><h2 id="section-title" tabindex="-1"></h2><p id="section-description"></p></div>
        <div id="questions"></div>
        <p id="form-error" role="alert" tabindex="-1" hidden></p>
        <div class="actions"><button id="previous" type="button" class="secondary">戻る</button><button id="next" type="submit">次へ <span aria-hidden="true">→</span></button></div>
        <p class="footnote" id="footnote">回答は最後の「回答を送信する」で送られます。</p>
      </form>
    </div>
  </main>
  <footer>Geo Model · 地学シリアスゲーム</footer>
</body>
</html>
